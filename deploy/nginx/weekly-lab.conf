server {
    listen 80;
    server_name weekly-lab.com www.weekly-lab.com;

    root /usr/share/nginx/weekly-lab;

    # Keep HTTP-01 validation reachable for certificate renewal.
    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://weekly-lab.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name weekly-lab.com;

    ssl_certificate /etc/letsencrypt/live/weekly-lab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/weekly-lab.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /usr/share/nginx/weekly-lab;
    index index.html;

    # Filenames are not content-hashed; revalidate after each deployment.
    expires -1;

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 443 ssl;
    server_name www.weekly-lab.com;

    ssl_certificate /etc/letsencrypt/live/weekly-lab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/weekly-lab.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://weekly-lab.com$request_uri;
}
